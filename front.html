<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speech Synth</title>
<link rel="stylesheet" href="front_css.css">
</head>
<body>
<div class="app">

  <div class="topbar">
    <span class="status"><span class="led" id="led"></span><span id="statusText">ОЖИДАНИЕ</span></span>
  </div>

  <div class="content">
    <main class="left">
      <div class="row r2">
        <section class="box">
          <label class="lbl">Микрофон
            <button class="icon-btn" id="btnMicSettings" title="Настройки микрофона"><img src="assets/settings.png" alt="⚙"></button>
          </label>
          <select id="selMic"><option>загрузка…</option></select>
        </section>
        <section class="box">
          <label class="lbl">Вывод звука</label>
          <select id="selOut"><option>загрузка…</option></select>
        </section>
      </div>

      <div class="row r2">
        <section class="box">
          <label class="lbl">Скорость <b id="rateVal">1.00×</b></label>
          <input type="range" id="sldRate" min="0.5" max="2" step="0.05" value="1">
        </section>
        <section class="box">
          <label class="lbl">Громкость <b id="volVal">100%</b></label>
          <input type="range" id="sldVol" min="0" max="1" step="0.01" value="1">
        </section>
      </div>

      <div class="row r-bottom">
        <div class="btns">
          <button class="ibtn" id="btnStart" title="Старт"></button>
          <button class="ibtn" id="btnPause" title="Пауза" disabled></button>
          <button class="ibtn" id="btnRecord" title="Запись">🎤</button>
        </div>
        <section class="box presets">
          <label class="lbl">
            Пресеты
            <button class="add-btn" id="btnAddPreset" title="Добавить пресет">+</button>
          </label>
          <div class="chips" id="chips"></div>
          <div class="prompt" id="promptText"></div>
        </section>
      </div>
    </main>

    <!-- НОВЫЙ БЛОК OLLAMA -->
    <aside class="box ollama-box" id="ollamaBox">
      <div class="logs-head"><span class="lbl">Ollama</span></div>
      <div id="ollamaStatus">Проверка...</div>
      <div id="ollamaActions" style="display:none; margin-top: 10px;">
        <button id="btnInstallOllama" class="m-btn primary">Скачать и установить Ollama</button>
      </div>
      <div id="ollamaModels" style="display:none; margin-top: 10px;">
        <label class="lbl">Выберите модель:</label>
        <select id="selModel" class="inp" style="width: 100%;"></select>
        <button id="btnDownloadModel" class="m-btn primary" style="margin-top: 5px;">Скачать модель</button>
      </div>
    </aside>

    <aside class="box logs">
      <div class="logs-head"><span class="lbl">Логи</span></div>
      <div class="log" id="log"></div>
    </aside>
  </div>
</div>

<div class="modal" id="presetModal">
  <div class="modal-box">
    <div class="modal-head">
      <span id="modalTitle">Редактировать пресет</span>
      <button class="modal-close" id="modalClose">×</button>
    </div>
    <label class="lbl">Название</label>
    <input type="text" id="pName" class="inp" placeholder="Например: Шутник">
    <label class="lbl" style="margin-top:8px;">Описание (prompt)</label>
    <textarea id="pPrompt" class="inp" rows="5" placeholder="Ты отвечаешь в стиле..."></textarea>
    <div class="modal-foot">
      <button class="m-btn danger" id="btnDelete">Удалить</button>
      <button class="m-btn ghost" id="btnCancel">Отмена</button>
      <button class="m-btn primary" id="btnSave">Сохранить</button>
    </div>
  </div>
</div>

<div class="modal" id="micSettingsModal">
  <div class="modal-box small">
    <div class="modal-head">
      <span>Настройки микрофона</span>
    </div>
    <label class="check"><input type="checkbox" id="chkPTT"> Прослушивание микрофона по нажатию</label>
    <div class="set-row">
      <span class="lbl">Клавиша</span>
      <button class="inp key-btn" id="btnKey">P</button>
      <span class="lbl">Тип</span>
      <select id="selPttMode">
        <option value="hold">Зажатие</option>
        <option value="toggle">Переключение</option>
      </select>
    </div>
    <label class="check"><input type="checkbox" id="chkOverlay"> Оверлей</label>
    <div class="set-col">
      <label class="lbl">Размер иконки <b id="ovSizeVal">32px</b></label>
      <input type="range" id="sldOvSize" min="16" max="128" step="4" value="32">
      <label class="lbl">Прозрачность <b id="ovAlphaVal">100%</b></label>
      <input type="range" id="sldOvAlpha" min="10" max="100" step="5" value="100">
      <label class="lbl">Позиция X <b id="ovXVal">50%</b></label>
      <input type="range" id="sldOvX" min="0" max="100" step="1" value="50">
      <label class="lbl">Позиция Y <b id="ovYVal">72%</b></label>
      <input type="range" id="sldOvY" min="0" max="100" step="1" value="72">
    </div>
    <div class="modal-foot">
      <button class="m-btn primary" id="btnSettingsClose">Закрыть</button>
    </div>
  </div>
</div>


<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/settings.js"></script>
<script src="js/ollama.js"></script>
<script src="js/recorder.js"></script>
<script src="js/app.js"></script>
</body>
</html>
