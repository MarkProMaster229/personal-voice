<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speech Synth</title>
<link rel="stylesheet" href="front_css.css">
</head>
<body>
<div class="app">

  <div class="topbar">
    <span class="status"><span class="led" id="led"></span><span id="statusText">ОЖИДАНИЕ</span></span>
  </div>

  <div class="content">
    <main class="left">
      <div class="row r2">
        <section class="box">
          <label class="lbl">Микрофон</label>
          <select id="selMic"><option>загрузка…</option></select>
        </section>
        <section class="box">
          <label class="lbl">Вывод звука</label>
          <select id="selOut"><option>загрузка…</option></select>
        </section>
      </div>

      <div class="row r2">
        <section class="box">
          <label class="lbl">Скорость <b id="rateVal">1.00×</b></label>
          <input type="range" id="sldRate" min="0.5" max="2" step="0.05" value="1">
        </section>
        <section class="box">
          <label class="lbl">Громкость <b id="volVal">100%</b></label>
          <input type="range" id="sldVol" min="0" max="1" step="0.01" value="1">
        </section>
      </div>

      <div class="row r-bottom">
        <div class="btns">
          <button class="ibtn" id="btnStart" title="Старт"></button>
          <button class="ibtn" id="btnPause" title="Пауза" disabled>
            <svg width="18" height="18" viewBox="0 0 16 16"><path d="M4 2h3v12H4zM9 2h3v12H9z" fill="currentColor"/></svg>
          </button>
        </div>
        <section class="box presets">
          <label class="lbl">Пресеты</label>
          <div class="chips" id="chips"></div>
          <div class="prompt" id="promptText"></div>
        </section>
      </div>
    </main>

    <aside class="box logs">
      <div class="logs-head"><span class="lbl">Логи</span></div>
      <div class="log" id="log"></div>
    </aside>
  </div>
</div>
<script src="front_js.js"></script>
</body>
</html>
