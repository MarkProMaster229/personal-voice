<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speech Synth</title>
<style>
  :root {
    --yellow: #f3ea61;
    --tan: #c3934a;
    --indigo: #373b5c;
    --dark: #1c2634;
    --steel: #314156;
    --khaki: #c1b07b;
    --orange: #e17a30;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--dark);
    color: var(--khaki);
    font: 13px "Source Sans Pro", "Segoe UI", system-ui, sans-serif;
  }

  .app {
    width: 900px;
    height: 540px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--dark);
    border: 1px solid var(--indigo);
    border-radius: 10px;
    box-shadow: 0 14px 44px rgba(0, 0, 0, .65);
  }

  .topbar {
    height: 34px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px 0 12px;
    background: var(--indigo);
  }

  .status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .6px;
    color: var(--khaki);
  }

  .led {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--dark);
  }

  .led.on {
    background: var(--yellow);
    box-shadow: 0 0 8px var(--yellow);
    animation: pulse 1.1s infinite;
  }

  .led.pause {
    background: var(--orange);
  }

  @keyframes pulse {
    50% {
      opacity: .45;
    }
  }

  .winbtns {
    display: flex;
    gap: 4px;
  }

  .wb {
    width: 26px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    color: var(--khaki);
    font-size: 10px;
    cursor: pointer;
    user-select: none;
  }

  .wb:hover {
    background: rgba(28, 38, 52, .6);
  }

  .wb.x:hover {
    background: var(--orange);
    color: var(--dark);
  }

  .content {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 290px;
    gap: 10px;
    padding: 10px;
  }

  .left {
    display: grid;
    gap: 10px;
    grid-template-rows: auto auto 1fr;
    min-height: 0;
  }

  .row {
    display: grid;
    gap: 10px;
  }

  .r2 {
    grid-template-columns: 1fr 1fr;
  }

  .r-bottom {
    grid-template-columns: auto 1fr;
    min-height: 0;
  }

  .box {
    background: var(--steel);
    border-radius: 8px;
    padding: 9px 11px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .lbl {
    display: flex;
    align-items: center;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .8px;
    text-transform: uppercase;
    color: var(--tan);
    user-select: none;
  }

  .lbl b {
    margin-left: auto;
    color: var(--yellow);
    font-weight: 600;
  }

  select {
    width: 100%;
    background: var(--dark);
    border: none;
    border-radius: 6px;
    padding: 7px 9px;
    color: var(--khaki);
    font: 12px inherit;
    outline: none;
    cursor: pointer;
  }

  select:hover {
    background: var(--indigo);
  }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    margin: auto 0;
    border-radius: 3px;
    background: var(--dark);
    outline: none;
    cursor: pointer;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--yellow);
    border: none;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .5);
    cursor: grab;
  }

  input[type=range]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--yellow);
    border: none;
  }

  .btns {
    display: flex;
    gap: 8px;
    align-self: center;
  }

  .ibtn {
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--dark);
    border: none;
    border-radius: 8px;
    color: var(--khaki);
    cursor: pointer;
    transition: .12s;
  }

  .ibtn:hover {
    background: var(--indigo);
    color: var(--yellow);
  }

  .ibtn:active {
    transform: scale(.96);
  }

  .ibtn:disabled {
    opacity: .35;
    cursor: default;
  }

  .ibtn:disabled:hover {
    background: var(--dark);
    color: var(--khaki);
  }

  .ibtn.on {
    background: var(--orange);
    color: var(--dark);
    box-shadow: 0 2px 12px rgba(225, 122, 48, .35);
  }

  .ibtn.hold {
    background: var(--yellow);
    color: var(--dark);
  }

  .presets {
    min-height: 0;
  }

  .chips {
    max-height: 86px;
    min-height: 28px;
    overflow-y: auto;
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    align-content: flex-start;
    padding: 2px;
    scrollbar-width: thin;
    scrollbar-color: var(--indigo) transparent;
  }

  .chips::-webkit-scrollbar {
    width: 7px;
  }

  .chips::-webkit-scrollbar-thumb {
    background: var(--indigo);
    border-radius: 4px;
  }

  .chips:empty::before {
    content: "-";
    color: rgba(195, 147, 74, .45);
    font-size: 11px;
    padding: 4px;
  }

  .chip {
    padding: 7px 12px;
    border-radius: 6px;
    background: var(--dark);
    color: var(--khaki);
    font-size: 12px;
    cursor: pointer;
    user-select: none;
  }

  .chip:hover {
    background: var(--indigo);
  }

  .chip.active {
    background: var(--yellow);
    color: var(--dark);
  }

  .prompt {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    background: var(--dark);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 12px;
    line-height: 1.45;
    color: var(--khaki);
    white-space: pre-wrap;
    scrollbar-width: thin;
    scrollbar-color: var(--indigo) transparent;
  }

  .prompt::-webkit-scrollbar {
    width: 7px;
  }

  .prompt::-webkit-scrollbar-thumb {
    background: var(--indigo);
    border-radius: 4px;
  }

  .prompt:empty::before {
    content: "-";
    color: rgba(195, 147, 74, .35);
  }

  .logs {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .logs-head {
    margin-bottom: 6px;
  }

  .log {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    font-size: 12px;
    line-height: 1.45;
    padding-right: 4px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    scrollbar-width: thin;
    scrollbar-color: var(--indigo) transparent;
  }

  .log::-webkit-scrollbar {
    width: 7px;
  }

  .log::-webkit-scrollbar-thumb {
    background: var(--indigo);
    border-radius: 4px;
  }

  .log:empty::before {
    content: "Пока тут пусто…";
    color: rgba(195, 147, 74, .35);
    padding: 3px 7px;
    font-size: 11px;
  }

  .log-entry {
    padding: 3px 7px;
    border-radius: 4px;
    background: rgba(28, 38, 52, .5);
    border-left: 2px solid var(--tan);
    word-break: break-word;
  }

  .log-entry .t {
    color: var(--tan);
    margin-right: 6px;
  }

  .log-entry.sys {
    color: var(--tan);
  }

  .log-entry.in {
    border-color: var(--yellow);
    color: var(--yellow);
  }

  .log-entry.out {
    border-color: var(--orange);
    color: var(--orange);
  }

  .log-entry.err {
    border-color: var(--orange);
    color: var(--orange);
    font-weight: 700;
  }

  @media (max-width: 1000px) {
    .app {
      width: 96vw;
      height: auto;
      min-height: 540px;
    }
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <span class="status"><span class="led" id="led"></span><span id="statusText">ОЖИДАНИЕ</span></span>
  </div>

  <div class="content">
    <main class="left">
      <div class="row r2">
        <section class="box">
          <label class="lbl">Микрофон</label>
          <select id="selMic"><option>загрузка…</option></select>
        </section>
        <section class="box">
          <label class="lbl">Вывод звука</label>
          <select id="selOut"><option>загрузка…</option></select>
        </section>
      </div>

      <div class="row r2">
        <section class="box">
          <label class="lbl">Скорость <b id="rateVal">1.00×</b></label>
          <input type="range" id="sldRate" min="0.5" max="2" step="0.05" value="1">
        </section>
        <section class="box">
          <label class="lbl">Громкость <b id="volVal">100%</b></label>
          <input type="range" id="sldVol" min="0" max="1" step="0.01" value="1">
        </section>
      </div>

      <div class="row r-bottom">
        <div class="btns">
          <button class="ibtn" id="btnStart" title="Старт"></button>
          <button class="ibtn" id="btnPause" title="Пауза" disabled>
            <svg width="18" height="18" viewBox="0 0 16 16"><path d="M4 2h3v12H4zM9 2h3v12H9z" fill="currentColor"/></svg>
          </button>
        </div>
        <section class="box presets">
          <label class="lbl">Пресеты</label>
          <div class="chips" id="chips"></div>
          <div class="prompt" id="promptText"></div>
        </section>
      </div>
    </main>

    <aside class="box logs">
      <div class="logs-head"><span class="lbl">Логи</span></div>
      <div class="log" id="log"></div>
    </aside>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const logBox = $('#log'), led = $('#led'), statusText = $('#statusText');
const selMic = $('#selMic'), selOut = $('#selOut');
const sldRate = $('#sldRate'), sldVol = $('#sldVol'), rateVal = $('#rateVal'), volVal = $('#volVal');
const btnStart = $('#btnStart'), btnPause = $('#btnPause'), chips = $('#chips'), promptText = $('#promptText');

const ICON_PLAY = '<svg width="18" height="18" viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z" fill="currentColor"/></svg>';
const ICON_STOP = '<svg width="18" height="18" viewBox="0 0 16 16"><path d="M3.5 3.5h9v9h-9z" fill="currentColor"/></svg>';

let running = false, paused = false;

const net = d => new Promise(r => setTimeout(() => r(d), 100));

const Backend = {
  async getDevices() {
    return net({
      inputs: [{ id: 'mic-0', label: 'fifine ' }],
      outputs: [{ id: 'cab-0', label: 'VB-Cable )' }]
    });
  },
  async setDevice(kind, id) {
    return net({ ok: true });
  },
  async getPresets() {
    return net([]);
  },
  async cmd(c) {
    return net({ ok: true, cmd: c });
  },
};

const esc = t => t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function renderLog(e) {
  const near = logBox.scrollHeight - logBox.scrollTop - logBox.clientHeight < 50;
  const el = document.createElement('div');
  el.className = 'log-entry ' + (e.type || 'sys');
  el.innerHTML = `<span class="t">[${e.time}]</span>${esc(e.msg)}`;
  logBox.appendChild(el);
  while (logBox.children.length > 300) logBox.removeChild(logBox.firstChild);
  if (near) logBox.scrollTop = logBox.scrollHeight;
}

async function loadDevices() {
  const d = await Backend.getDevices();
  selMic.innerHTML = '';
  selOut.innerHTML = '';
  d.inputs.forEach(x => selMic.add(new Option(x.label, x.id)));
  d.outputs.forEach(x => selOut.add(new Option(x.label, x.id)));
}

selMic.onchange = () => Backend.setDevice('input', selMic.value);
selOut.onchange = () => Backend.setDevice('output', selOut.value);

function paint(s) {
  const p = ((s.value - s.min) / (s.max - s.min)) * 100;
  s.style.background = `linear-gradient(90deg, var(--orange) ${p}%, var(--dark) ${p}%)`;
}

function updSliders() {
  rateVal.textContent = (+sldRate.value).toFixed(2) + '×';
  volVal.textContent = Math.round(sldVol.value * 100) + '%';
  paint(sldRate);
  paint(sldVol);
}

sldRate.oninput = sldVol.oninput = updSliders;

let presets = [], activePreset = null;

async function loadPresets() {
  presets = await Backend.getPresets();
  renderPresets();
}

function renderPresets() {
  chips.innerHTML = '';
  promptText.textContent = '';
  presets.forEach(p => {
    const c = document.createElement('div');
    c.className = 'chip' + (p.id === activePreset ? ' active' : '');
    c.textContent = p.name;
    c.onclick = () => {
      activePreset = p.id;
      promptText.textContent = p.prompt || '';
      renderPresets();
    };
    chips.appendChild(c);
  });
  if (!presets.length) activePreset = null;
}

function ui() {
  btnStart.innerHTML = running ? ICON_STOP : ICON_PLAY;
  btnStart.title = running ? 'Стоп' : 'Старт';
  btnStart.classList.toggle('on', running);
  btnPause.disabled = !running;
  btnPause.classList.toggle('hold', paused);
  led.className = 'led' + (running ? (paused ? ' pause' : ' on') : '');
  statusText.textContent = running ? (paused ? 'Пауза' : 'Работа') : 'Не Работа';
}

btnStart.onclick = async () => {
  await Backend.cmd(running ? 'stop' : 'start');
  running = !running;
  paused = false;
  ui();
};

btnPause.onclick = async () => {
  if (!running) return;
  await Backend.cmd(paused ? 'resume' : 'pause');
  paused = !paused;
  ui();
};

updSliders();
ui();
loadDevices();
loadPresets();
</script>
</body>
</html>
